# Local Auth only. Content remains in native PostgreSQL, managed by Drizzle.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "project-mina"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

# Both first-time and returning readers receive a code in the local inbox.
[auth.email.template.confirmation]
subject = "Your Games Watchdog sign-in code"
content_path = "./supabase/templates/sign-in.html"

[auth.email.template.magic_link]
subject = "Your Games Watchdog sign-in code"
content_path = "./supabase/templates/sign-in.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
